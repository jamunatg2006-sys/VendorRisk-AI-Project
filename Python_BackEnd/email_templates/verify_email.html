<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        .header { border-bottom: 2px solid #2563eb; padding-bottom: 20px; }
        h1 { color: #1e40af; margin: 0; }
        .content { padding: 30px 0; }
        .button { background: #2563eb; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; display: inline-block; margin: 20px 0; }
        .footer { text-align: center; color: #666; font-size: 12px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ VendorRisk</h1>
        </div>
        <div class="content">
            <h2>Welcome to VendorRisk!</h2>
            <p>Thank you for registering. Please verify your email address to complete your account setup.</p>
            <p><a href="{verify_link}" class="button">Verify Email Address</a></p>
            <p>Or copy this link: <br><code>{verify_link}</code></p>
            <p><strong>This link expires in 24 hours.</strong></p>
        </div>
        <div class="footer">
            <p>© 2026 VendorRisk. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
