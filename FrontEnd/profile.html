<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - VendorRisk</title>
    <style>
        :root {
            --dark-blue: #0A1128;
            --light-blue: #0077B6;
            --accent-blue: #00B4D8;
            --text-white: #E0FBFC;
            --text-light-gray: #B3C4EF;
            --glow-color: rgba(0, 180, 216, 0.5);
            --card-bg: rgba(16, 26, 58, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-blue);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(10, 17, 40, 0.95);
            backdrop-filter: blur(10px);
            color: var(--text-white);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--light-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--light-blue), var(--accent-blue));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .navbar-right {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .navbar-right a,
        .navbar-right button {
            color: var(--text-light-gray);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .navbar-right a:hover,
        .navbar-right button:hover {
            color: var(--accent-blue);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 30px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--light-blue);
        }

        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-light-gray);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-btn:hover {
            color: var(--accent-blue);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--light-blue);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
        }

        /* Forms */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: #050a1a;
            border: 1px solid var(--light-blue);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-white);
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-light-gray);
            opacity: 0.5;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-blue);
        }

        .checkbox-group label {
            margin-bottom: 0;
            text-transform: none;
            color: var(--text-white);
        }

        /* Buttons */
        .btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--light-blue), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--glow-color);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .btn-secondary:hover {
            background: rgba(0, 180, 216, 0.1);
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #c0392b);
        }

        .btn-danger:hover {
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3);
        }

        /* Messages */
        .message {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 13px;
        }

        .message.success {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
            display: block;
        }

        /* Preference Items */
        .preference-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            background: rgba(5, 10, 26, 0.5);
            border: 1px solid var(--light-blue);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .preference-item:hover {
            border-color: var(--accent-blue);
        }

        .preference-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preference-label strong {
            color: var(--text-white);
            font-size: 14px;
        }

        .preference-label small {
            color: var(--text-light-gray);
            font-size: 11px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2c3e50;
            transition: 0.3s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked+.toggle-slider {
            background: linear-gradient(135deg, var(--light-blue), var(--accent-blue));
        }

        input:checked+.toggle-slider:before {
            transform: translateX(26px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 12px 20px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .navbar-right {
                gap: 15px;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .tab-content {
                padding: 20px;
            }

            .preference-item {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">🛡️ VendorRisk</div>
        <div class="navbar-right">
            <a href="dashboard.html">Dashboard</a>
            <span id="userDisplay">User</span>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Profile Settings</h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
            <button class="tab-btn" onclick="switchTab('preferences')">Notification Preferences</button>
            <button class="tab-btn" onclick="switchTab('security')">Security</button>
        </div>

        <!-- Profile Tab -->
        <div id="profile" class="tab-content active">
            <div id="profileMessage" class="message"></div>
            <form id="profileForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <button type="submit" class="btn">Update Profile</button>
            </form>
        </div>

        <!-- Preferences Tab -->
        <div id="preferences" class="tab-content">
            <div id="preferencesMessage" class="message"></div>
            <form id="preferencesForm">
                <div class="preference-item">
                    <div class="preference-label">
                        <strong>High Risk Alerts</strong>
                        <small>Get notified when a vendor reaches high risk</small>
                    </div>
                    <input type="checkbox" id="alert_on_high_risk" checked>
                </div>

                <div class="preference-item">
                    <div class="preference-label">
                        <strong>Critical Vulnerabilities</strong>
                        <small>Immediate alerts for critical security issues</small>
                    </div>
                    <input type="checkbox" id="alert_on_critical" checked>
                </div>

                <div class="form-group">
                    <label for="digest_frequency">Digest Frequency</label>
                    <select id="digest_frequency" required>
                        <option value="daily">Daily</option>
                        <option value="weekly" selected>Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>

                <button type="submit" class="btn">Save Preferences</button>
            </form>
        </div>

        <!-- Security Tab -->
        <div id="security" class="tab-content">
            <div id="securityMessage" class="message"></div>
            <h2 style="margin-bottom: 20px; color: #1f2937;">Change Password</h2>
            <form id="securityForm">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required
                        placeholder="Minimum 8 characters">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn">Change Password</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001';
        let sessionToken = localStorage.getItem('sessionToken');
        let user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!sessionToken) {
            window.location.href = 'login.html';
        }

        // Set user display
        document.getElementById('userDisplay').textContent = user.username || 'User';

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        // Load preferences
        async function loadPreferences() {
            try {
                const response = await fetch(`${API_BASE}/user/preferences`, {
                    headers: { 'Authorization': `Bearer ${sessionToken}` }
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('alert_on_high_risk').checked = data.data.alert_on_high_risk;
                    document.getElementById('alert_on_critical').checked = data.data.alert_on_critical;
                    document.getElementById('digest_frequency').value = data.data.digest_frequency;
                }
            } catch (error) {
                console.error('Error loading preferences:', error);
            }
        }

        // Profile form
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('profileMessage');

            try {
                const response = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (data.success) {
                    msg.textContent = '✅ ' + data.message;
                    msg.classList.add('success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                msg.textContent = '❌ ' + error.message;
                msg.classList.add('error');
            }
        });

        // Preferences form
        document.getElementById('preferencesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('preferencesMessage');

            try {
                const response = await fetch(`${API_BASE}/user/preferences`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({
                        alert_on_high_risk: document.getElementById('alert_on_high_risk').checked,
                        alert_on_critical: document.getElementById('alert_on_critical').checked,
                        digest_frequency: document.getElementById('digest_frequency').value
                    })
                });
                const data = await response.json();
                if (data.success) {
                    msg.textContent = '✅ ' + data.message;
                    msg.classList.add('success');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                msg.textContent = '❌ ' + error.message;
                msg.classList.add('error');
            }
        });

        // Security form
        document.getElementById('securityForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('securityMessage');

            try {
                const response = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionToken}`
                    },
                    body: JSON.stringify({
                        currentPassword: document.getElementById('currentPassword').value,
                        newPassword: document.getElementById('newPassword').value,
                        confirmPassword: document.getElementById('confirmPassword').value
                    })
                });
                const data = await response.json();
                if (data.success) {
                    msg.textContent = '✅ ' + data.message;
                    msg.classList.add('success');
                    document.getElementById('securityForm').reset();
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                msg.textContent = '❌ ' + error.message;
                msg.classList.add('error');
            }
        });

        // Logout
        function logout() {
            fetch(`${API_BASE}/auth/logout`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${sessionToken}` }
            }).finally(() => {
                localStorage.removeItem('sessionToken');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });
        }

        // Load initial data
        document.getElementById('email').value = user.email || '';
        loadPreferences();
    </script>
</body>

</html>
