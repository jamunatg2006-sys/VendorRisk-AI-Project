<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VendorRisk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        .reset-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .logo { font-size: 32px; font-weight: bold; color: #2563eb; margin-bottom: 10px; }
        h1 { font-size: 28px; color: #1f2937; margin-bottom: 10px; }
        .subtitle { color: #6b7280; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #374151; font-weight: 500; font-size: 14px; }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: none;
        }
        .error.show { display: block; }
        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
            display: none;
        }
        .success.show { display: block; }
        .password-requirements {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }
        .password-requirements ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }
        .password-requirements li.met { color: #16a34a; }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <div class="container">
        <div class="reset-box">
            <div class="header">
                <div class="logo">🛡️</div>
                <h1>Create New Password</h1>
                <p class="subtitle">Enter your new password below</p>
            </div>

            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required placeholder="Minimum 8 characters">
                    <div class="password-requirements">
                        <ul>
                            <li id="lengthReq">✗ At least 8 characters</li>
                            <li id="numberReq">✗ Contains a number</li>
                            <li id="upperReq">✗ Contains uppercase letter</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>

                <button type="submit" class="btn" id="resetBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'https://vendorrisk-ai-backendd.onrender.com';
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('errorMsg').textContent = '❌ Invalid or missing reset token';
            document.getElementById('errorMsg').classList.add('show');
            document.getElementById('resetBtn').disabled = true;
        }

        // Password validation
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            document.getElementById('lengthReq').classList.toggle('met', password.length >= 8);
            document.getElementById('numberReq').classList.toggle('met', /\d/.test(password));
            document.getElementById('upperReq').classList.toggle('met', /[A-Z]/.test(password));
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (password !== confirmPassword) {
                errorMsg.textContent = '❌ Passwords do not match';
                errorMsg.classList.add('show');
                return;
            }

            if (password.length < 8) {
                errorMsg.textContent = '❌ Password must be at least 8 characters';
                errorMsg.classList.add('show');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password, confirmPassword })
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = '✅ Password reset successful! Redirecting to login...';
                    successMsg.classList.add('show');
                    setTimeout(() => window.location.href = 'login.html', 2500);
                } else {
                    throw new Error(data.error || 'Password reset failed');
                }
            } catch (error) {
                errorMsg.textContent = '❌ ' + (error.message || 'An error occurred');
                errorMsg.classList.add('show');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
