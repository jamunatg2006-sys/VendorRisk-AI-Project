<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VendorRisk AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        :root {
            --dark-blue: #0A1128;
            --light-blue: #0077B6;
            --accent-blue: #00B4D8;
            --text-white: #E0FBFC;
            --text-light-gray: #B3C4EF;
            --glow-color: rgba(0, 180, 216, 0.5);
            --card-bg: rgba(16, 26, 58, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 119, 182, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 180, 216, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--light-blue);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .login-box:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 30px var(--glow-color);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--light-blue), var(--accent-blue));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-white);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-light-gray);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-blue);
            font-size: 16px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: #050a1a;
            border: 1px solid var(--light-blue);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--glow-color);
        }

        input::placeholder {
            color: var(--text-light-gray);
            opacity: 0.5;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--light-blue), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--glow-color);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 71, 87, 0.3);
            display: none;
            font-size: 13px;
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(46, 213, 115, 0.3);
            display: none;
            font-size: 13px;
        }

        .success.show {
            display: block;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot-password a {
            color: var(--text-light-gray);
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }

        .forgot-password a:hover {
            color: var(--accent-blue);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 119, 182, 0.3);
            color: var(--text-light-gray);
            font-size: 13px;
        }

        .footer-text a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .footer-text a:hover {
            text-shadow: 0 0 10px var(--glow-color);
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .login-box {
                padding: 30px 25px;
            }

            .logo-text {
                font-size: 24px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="responsive.css">
</head>

<body>
    <div class="container">
        <div class="login-box">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <span class="logo-text">VendorRisk-AI</span>
                </div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Vendor Risk Management Platform</p>
            </div>

            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username or email"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn" id="loginBtn">Sign In</button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://vendorrisk-ai-backendd.onrender.com';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('sessionToken', data.sessionToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    successMsg.textContent = '✅ Login successful! Redirecting...';
                    successMsg.classList.add('show');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (error) {
                errorMsg.textContent = '❌ ' + (error.message || 'An error occurred');
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
